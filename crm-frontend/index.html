<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Система управления контактными данными клиентов</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="css/media.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.6-beta.21/jquery.inputmask.min.js"></script>
    <script type="module" src="./js/index.js"></script>
  </head>

  <body>
    <header class="header">
      <div class="container header__container">
        <div><img class="logo" src="./img/logo.svg" alt="logo" /></div>
        <form id="form-req" class="form-request">
          <input
            id="inp-req"
            class="input-request"
            type="text"
            name="request"
            placeholder="Введите запрос"
            aria-label="Поиск клиентов"
          />
          <div class="search-spinner hidden"></div>
          <ul id="autocomplete-list" class="autocomplete-list list-reset"></ul>
        </form>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <h1 class="main-title">Клиенты</h1>
          <div class="table-container">
            <table id="tableClients" class="table">
              <thead>
                <tr>
                  <th class="table__th th-padding-id" data-column="id">
                    <button
                      class="btn-reset arrow-id arrow arrow-up arrow-active"
                    >
                      <span class="span-color">ID</span>
                    </button>
                  </th>
                  <th
                    class="table__th th-padding-fullname"
                    data-column="surname"
                  >
                    <button
                      class="btn-reset th-text arrow arrow-inactive arrow-left"
                    >
                      Фамилия Имя Отчество
                      <span class="span-color span-color-fullname span-inactive"
                        >А-Я</span
                      >
                    </button>
                  </th>
                  <th
                    class="table__th th-padding-datetime-create"
                    data-column="createdAt"
                  >
                    <button
                      class="btn-reset th-text arrow arrow-inactive arrow-right"
                    >
                      Дата и время создания
                    </button>
                  </th>
                  <th
                    class="table__th th-padding-datetime-updated"
                    data-column="updatedAt"
                  >
                    <button
                      class="btn-reset th-text arrow arrow-inactive arrow-right"
                    >
                      Последние изменения
                    </button>
                  </th>
                  <th class="table__th th-padding-contacts">Контакты</th>
                  <th class="table__th th-padding-actions">Действия</th>
                </tr>
              </thead>

              <tbody id="tbody" class="table__tbody">
                <tr>
                  <td colspan="6" class="td-spinner"></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="block-btn-add">
            <button id="btn-add" class="btn-reset btn-add">
              <svg
                width="23"
                height="16"
                viewBox="0 0 23 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M14.5 8C16.71 8 18.5 6.21 18.5 4C18.5 1.79 16.71 0 14.5 0C12.29 0 10.5 1.79 10.5 4C10.5 6.21 12.29 8 14.5 8ZM5.5 6V3H3.5V6H0.5V8H3.5V11H5.5V8H8.5V6H5.5ZM14.5 10C11.83 10 6.5 11.34 6.5 14V16H22.5V14C22.5 11.34 17.17 10 14.5 10Z"
                  fill="#9873FF"
                />
              </svg>
              Добавить клиента
            </button>
          </div>
          <div id="modal" class="modal hidden"></div>
        </div>
      </section>
      <div id="overlay" class="overlay hidden"></div>
    </main>
  </body>
</html>
